<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 Core Overload — NandX Cyberpunk Neon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">

<body>
  <main class="nx-center-shell">
    <section class="nx-card nx-card--hud nx-auth-card">
      <div class="nx-card__header">
        <span class="nx-hud-label"><span class="nx-dot nx-dot--danger nx-dot--pulse" aria-hidden="true"></span> ERR_CORE_OVERLOAD</span>
        <span class="nx-badge nx-badge--danger">500</span>
      </div>
      <div class="nx-card__body">
        <h1 class="nx-glitch nx-text-glow-magenta">500 // INTERNAL FAULT</h1>
        <p>The upstream neural cluster returned an unhandled server fault. Automated recovery has been triggered.</p>
        <pre class="nx-code-block nx-mb-6"><code>$ journalctl -u nandx-core --tail=3
[CRIT] 500: Upstream worker timeout (node:tokyo-01)
[INFO] Failover sequence initiated...<span class="nx-cursor" aria-hidden="true"></span></code></pre>
        <div class="nx-flex nx-flex-wrap nx-gap-3">
          <button type="button" class="nx-btn nx-btn--magenta" onclick="window.location.reload()">Retry Request</button>
          <a href="index.html" class="nx-btn nx-btn--ghost">Back to Home</a>
        </div>
      </div>
    </section>
  </main>
  <script src="assets/js/main.js" defer></script>
</body>
