<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password &amp; Lock Screen — NandX Cyberpunk Neon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layouts.css">
</head>
<body>
  <main class="nx-center-shell">
    <section class="nx-card nx-card--hud nx-auth-card" data-nx-tabs>
      <div class="nx-card__header">
        <h1 class="nx-card__title">Key Recovery</h1>
        <span class="nx-badge nx-badge--amber">LOCKED</span>
      </div>
      <div class="nx-card__body">
        <div class="nx-tabs__list" role="tablist">
          <button type="button" class="nx-tab-btn is-active" role="tab" aria-selected="true" data-nx-tab-target="rec-reset">Reset Key</button>
          <button type="button" class="nx-tab-btn" role="tab" aria-selected="false" data-nx-tab-target="rec-lock">Lock Screen</button>
        </div>

        <form class="nx-tab-panel is-active" data-nx-tab-panel="rec-reset" onsubmit="event.preventDefault();">
          <p>Enter your registered operator email to receive a one-time recovery token.</p>
          <div class="nx-field">
            <label class="nx-label" for="reset-email">Operator Email</label>
            <input id="reset-email" type="email" class="nx-input" placeholder="operator@nandx.io" required>
          </div>
          <button type="submit" class="nx-btn nx-btn--primary nx-w-full" data-nx-toast="Recovery token dispatched.">Send Recovery Link</button>
        </form>

        <form class="nx-tab-panel" data-nx-tab-panel="rec-lock" action="dashboard.html">
          <div class="nx-flex nx-items-center nx-gap-4 nx-mb-4">
            <span class="nx-avatar nx-avatar--lg">KT</span>
            <div>
              <strong>K. Tanaka</strong>
              <p class="nx-mono nx-mb-2">Session idle timeout</p>
            </div>
          </div>
          <div class="nx-field">
            <label class="nx-label" for="unlock-pin">Unlock Passkey</label>
            <input id="unlock-pin" type="password" class="nx-input" placeholder="Enter passkey..." required>
          </div>
          <button type="submit" class="nx-btn nx-btn--magenta nx-w-full">Unlock Terminal</button>
        </form>
      </div>
    </section>

    <p class="nx-mt-4 nx-mono"><a href="login.html">&larr; Back to Login</a></p>
  </main>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
